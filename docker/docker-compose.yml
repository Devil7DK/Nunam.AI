# Homelab stack: Postgres + pgvector, migrations, API, web UI and AI worker.
# Indexers run natively on each machine; Ollama runs separately (its own GPU container).
#   cp docker/.env.example docker/.env   # then edit
#   docker compose -f docker/docker-compose.yml up -d --build
name: nunam

services:
  postgres:
    image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NUNAM_API_PASSWORD: ${NUNAM_API_PASSWORD}
    volumes:
      # Postgres 18 images keep data in a versioned folder under /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
      - ./postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./postgres/20-tls.sh:/docker-entrypoint-initdb.d/20-tls.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrations:
    build:
      context: ..
      dockerfile: docker/migrations.Dockerfile
    environment:
      NUNAM_MIGRATION_CONNECTION: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Require
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  nunam-api:
    build:
      context: ..
      dockerfile: Nunam.API/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB};Username=nunam_api;Password=${NUNAM_API_PASSWORD};SSL Mode=Require
      # Only nginx can reach the API (it isn't published), so its X-Forwarded-* headers can be trusted.
      Auth__TrustForwardedHeaders: "true"
      Agents__WorkerToken: ${NUNAM_WORKER_TOKEN}
      Agents__PackageFolder: /packages
      AI__Provider: ${AI_PROVIDER:-Ollama}
      AI__BaseUrl: ${AI_BASE_URL}
      AI__EmbeddingModel: ${AI_EMBEDDING_MODEL:-bge-m3}
      # Encrypts describe providers' API keys in the database.
      Secrets__Key: ${NUNAM_SECRETS_KEY:-}
    volumes:
      # The indexer packages the Add machine command downloads (build-packages.sh, build-msi.sh).
      - ../artifacts/packages:/packages:ro
    depends_on:
      migrations:
        condition: service_completed_successfully

  nunam-ui:
    build:
      context: ..
      dockerfile: Nunam.WebUI/Dockerfile
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:80"
      - "${UI_HTTPS_PORT:-3443}:443"
    environment:
      NUNAM_TRUSTED_PROXY: ${NUNAM_TRUSTED_PROXY:-127.0.0.1/32}
      NUNAM_TLS_NAMES: ${NUNAM_TLS_NAMES:-}
      NUNAM_TLS_PIN: ${NUNAM_TLS_PIN:-auto}
    volumes:
      # cert.pem and key.pem for the HTTPS port: yours, or a self-signed pair created on first start.
      - ./tls:/etc/nunam/tls
    depends_on:
      - nunam-api

  nunam-aiworker:
    build:
      context: ..
      dockerfile: Nunam.AIWorker/Dockerfile
    restart: unless-stopped
    environment:
      Server__Url: http://nunam-api:8080
      Server__Token: ${NUNAM_WORKER_TOKEN}
      AI__Provider: ${AI_PROVIDER:-Ollama}
      AI__BaseUrl: ${AI_BASE_URL}
      AI__EmbeddingModel: ${AI_EMBEDDING_MODEL:-bge-m3}
    depends_on:
      - nunam-api

volumes:
  pgdata:
