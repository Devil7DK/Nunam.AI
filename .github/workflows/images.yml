# Builds the server's images from master and pushes them to GitHub Packages
# (ghcr.io/<owner>/nunam-*), tagged latest and <yyyymmdd>-<short sha>. Versioned images come from
# release.yml. Actions are pinned by commit, like the base images by digest.
name: Images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.image }}
    # A manual run from another branch would otherwise overwrite latest.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nunam-api
            dockerfile: Nunam.API/Dockerfile
          - image: nunam-ui
            dockerfile: Nunam.WebUI/Dockerfile
          - image: nunam-aiworker
            dockerfile: Nunam.AIWorker/Dockerfile
          - image: nunam-migrations
            dockerfile: docker/migrations.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name and tags
        id: name
        run: |
          # Image names must be lowercase; the owner's login may not be.
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "dated=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.name.outputs.dated }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
