# Serves the built UI and forwards /api to the API container, so the browser talks to one origin.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;

    location /api/ {
        proxy_pass http://nunam-api:8080;
        proxy_set_header Host $host;
        # Replaces whatever the client sent: the API trusts these to rate-limit sign-ins per address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
